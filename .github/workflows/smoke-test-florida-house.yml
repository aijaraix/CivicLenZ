name: Smoke test Florida House collector

on:
  pull_request:
    paths:
      - 'workers/ingestion/collect_florida_house.py'
      - 'tests/test_collect_florida_house.py'
      - '.github/workflows/smoke-test-florida-house.yml'
  push:
    branches: [main]
    paths:
      - 'workers/ingestion/collect_florida_house.py'
      - 'tests/test_collect_florida_house.py'
      - '.github/workflows/smoke-test-florida-house.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-florida-house:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workers/ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r workers/ingestion/requirements.txt

      - name: Run Florida House parser regression tests
        run: python -m unittest tests.test_collect_florida_house

      - name: Inspect live Florida House source structure
        run: |
          python - <<'PY'
          from pathlib import Path
          from workers.ingestion.common import fetch
          from bs4 import BeautifulSoup

          response = fetch('https://www.flhouse.gov/Representatives')
          Path('/tmp/flhouse.html').write_text(response.text, encoding='utf-8')
          soup = BeautifulSoup(response.text, 'lxml')
          print('status=', response.status_code)
          print('final_url=', response.url)
          print('title=', soup.title.get_text(' ', strip=True) if soup.title else 'none')
          print('html_length=', len(response.text))
          links = []
          for anchor in soup.find_all('a', href=True):
              href = str(anchor.get('href', ''))
              text = ' '.join(anchor.get_text(' ', strip=True).split())
              if 'Represent' in href or 'Member' in href or 'represent' in href:
                  links.append((href, text))
          print('representative_like_links=', len(links))
          for href, text in links[:40]:
              print('LINK', repr(href), repr(text))
          PY

      - name: Upload live Florida House source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: florida-house-live-source-${{ github.run_number }}
          path: /tmp/flhouse.html
          if-no-files-found: error
          retention-days: 2

      - name: Collect live Florida House directory
        run: python -m workers.ingestion.collect_florida_house --output /tmp/florida-house

      - name: Verify near-complete Florida House directory
        run: |
          count=$(find /tmp/florida-house -name '*.json' -type f | wc -l | tr -d ' ')
          echo "Live Florida House records: $count"
          test "$count" -ge 115
          test "$count" -le 120
