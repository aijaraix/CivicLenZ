name: Official-source portrait jobs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'workers/portraits/**'
      - 'data/portraits/**'
      - 'data/officials/**'
      - '.github/workflows/official-portraits.yml'

permissions:
  contents: read

jobs:
  portrait-job:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workers/ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r workers/ingestion/requirements.txt

      - name: Verify persisted portrait jobs
        run: python -m unittest tests.test_portrait_job
