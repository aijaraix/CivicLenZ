name: Apply producer parent validation reconciliation
on:
  push:
    branches: [chatgpt/reconcile-producer-validation-parent]
permissions:
  contents: write
jobs:
  apply-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psycopg2-binary
      - name: Apply exact patch
        run: git apply --check parent-reconcile.patch && git apply parent-reconcile.patch
      - name: Prime tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s services/hermes-prime/tests -p 'test_*.py'
      - name: Verify exact hashes
        run: |
          test "$(git hash-object services/hermes-prime/producer_outbound.py)" = "bb2fa30bdf8d0650e54eaf094c905f92b909603e"
          test "$(git hash-object services/hermes-prime/tests/test_producer_outbound.py)" = "1e09cdbd7570eccaca458357f7dbe238107237c5"
          git diff --check
      - name: Clean staging artifacts
        run: rm -f parent-reconcile.patch .github/workflows/apply-parent-reconcile.yml
      - name: Commit verified source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/hermes-prime/producer_outbound.py services/hermes-prime/tests/test_producer_outbound.py
          git add -u parent-reconcile.patch .github/workflows/apply-parent-reconcile.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'Reconcile producer validation result to parent ResearchNeed [skip ci]'
          git push origin HEAD:chatgpt/reconcile-producer-validation-parent
