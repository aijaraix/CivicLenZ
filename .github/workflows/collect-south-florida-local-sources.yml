name: Collect South Florida local sources

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/operations/florida-work-allocation.json'
      - 'data/sources/florida-regions/south-florida/**'
      - 'data/staging/florida/local/south-florida/**'
      - 'data/operations/florida/south-florida/**'
      - 'workers/ingestion/discover_south_florida_local_sources.py'
      - '.github/workflows/collect-south-florida-local-sources.yml'
  push:
    branches: [main]
    paths:
      - 'data/operations/florida-work-allocation.json'
      - 'data/sources/florida-regions/south-florida/**'
      - 'data/staging/florida/local/south-florida/**'
      - 'data/operations/florida/south-florida/**'
      - 'workers/ingestion/discover_south_florida_local_sources.py'
      - '.github/workflows/collect-south-florida-local-sources.yml'

concurrency:
  group: south-florida-local-source-discovery
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workers/ingestion/requirements.txt

      - name: Install discovery dependencies
        run: pip install -r workers/ingestion/requirements.txt

      - name: Run isolated parser self-test
        run: python -m workers.ingestion.discover_south_florida_local_sources --self-test

      - name: Verify coordination gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR #32 is the only allowed owner of the claim. A draft implementation
            # can validate its parser before that claim is merged, but cannot collect.
            python -m workers.ingestion.discover_south_florida_local_sources \
              --verify-claim \
              --allow-missing-claim
          else
            python -m workers.ingestion.discover_south_florida_local_sources --verify-claim
          fi

      - name: Show bounded run configuration
        run: |
          python -m workers.ingestion.discover_south_florida_local_sources \
            --dry-run \
            ${{ github.event_name == 'pull_request' && '--allow-missing-claim' || '' }}

      - name: Discover official source directories
        if: github.event_name != 'pull_request'
        run: |
          python -m workers.ingestion.discover_south_florida_local_sources \
            --workers 2 \
            --max-pages-per-county 8 \
            --max-candidates-per-category 12 \
            --minimum-success-rate 0.50

      - name: Summarize discovery
        if: github.event_name != 'pull_request'
        id: summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          paths = sorted(Path('data/staging/florida/local/south-florida/source-discovery').glob('*.json'))
          records = [json.loads(path.read_text()) for path in paths]
          successes = sum(item.get('collectionStatus') in {'success', 'partial'} for item in records)
          resolved = sum(item.get('resolvedCategoryCount', 0) for item in records)
          unresolved = sum(len(item.get('unresolvedCategories', [])) for item in records)
          print('### South Florida local source discovery')
          print(f'- County records generated: **{len(records)}**')
          print(f'- Reachable/partially reachable county roots: **{successes}**')
          print(f'- Source categories resolved: **{resolved}**')
          print(f'- Source categories still unresolved: **{unresolved}**')
          print('- Publication state: **review-only source candidates**')
          print('- Counties: **Broward, Miami-Dade**')
          PY

      - name: Upload review-only discovery snapshot
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: south-florida-local-source-discovery-${{ github.run_number }}
          path: data/staging/florida/local/south-florida/source-discovery/*.json
          if-no-files-found: error
          retention-days: 21

      - name: Save scheduled results to review branch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUTPUT='data/staging/florida/local/south-florida/source-discovery'
          BRANCH='bot/fl-south-local-source-discovery'
          CHANGES=$(git status --porcelain --untracked-files=all -- "$OUTPUT")
          if [ -z "$CHANGES" ]; then
            echo 'No South Florida source-discovery changes detected.'
            exit 0
          fi

          git config user.name 'civiclenz-data-bot'
          git config user.email 'civiclenz-data-bot@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add "$OUTPUT"
          git commit -m 'Refresh South Florida local source discovery'
          git push --force origin "HEAD:refs/heads/$BRANCH"

          OPEN_PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$OPEN_PR" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title 'Data review: South Florida local source directories' \
              --body 'Review-only source candidates for Broward and Miami-Dade county, constitutional-office, school, municipal, special-district, judicial, campaign-finance, and disclosure collection. This PR does not publish officeholders or person data.' || true
          else
            echo "Updated existing South Florida source review PR #$OPEN_PR"
          fi
