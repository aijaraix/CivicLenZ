name: Apply same-attempt producer recovery

on:
  push:
    branches:
      - chatgpt/producer-outbound-same-attempt-recovery

permissions:
  contents: write

jobs:
  apply-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/producer-outbound-same-attempt-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Prime test dependency
        run: python -m pip install --quiet psycopg2-binary
      - name: Apply exact tested patch
        run: git apply --check .github/recovery-same-attempt.patch && git apply .github/recovery-same-attempt.patch
      - name: Verify HERMES Prime suite
        working-directory: services/hermes-prime
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: Verify exact source hashes
        run: |
          test "$(git hash-object services/hermes-prime/contract_dispatcher.py)" = "b1ef08371d89fd0e8fe5c5073e697ba747b16a55"
          test "$(git hash-object services/hermes-prime/producer_outbound.py)" = "948250288267d377db95c67fff132f07bccf6349"
          test "$(git hash-object services/hermes-prime/tests/test_producer_outbound.py)" = "39330045423fcc7810b34dd52375dce53b9dc81a"
          git diff --check
      - name: Commit clean verified change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/hermes-prime/contract_dispatcher.py services/hermes-prime/producer_outbound.py services/hermes-prime/tests/test_producer_outbound.py
          git rm .github/recovery-same-attempt.patch .github/workflows/apply-same-attempt-recovery.yml
          git commit -m "Recover one unconfirmed producer delivery without attempt 2 [skip ci]"
          git push origin HEAD:chatgpt/producer-outbound-same-attempt-recovery
