name: Smoke test Florida legislative detail enrichment

on:
  pull_request:
    paths:
      - 'workers/enrichment/collect_florida_legislative_details.py'
      - 'tests/test_florida_legislative_details.py'
      - '.github/workflows/smoke-test-florida-legislative-details.yml'
      - '.github/workflows/collect-florida-legislative-details.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workers/ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r workers/ingestion/requirements.txt

      - name: Run detail parser tests
        run: python -m unittest tests.test_florida_legislative_details

      - name: Collect live House and Senate sample
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from workers.enrichment.collect_florida_legislative_details import collect_record, write_records

          house = sorted(Path('data/staging/florida/state-house').glob('*.json'))[:3]
          senate = sorted(Path('data/staging/florida/state-senate').glob('*.json'))[:3]
          records = [collect_record(path) for path in house + senate]
          write_records(records, Path('data/research-staging/florida/legislative-details-smoke'))
          successes = sum(item.get('collectionStatus') == 'success' for item in records)
          portraits = sum(bool(item.get('portraitCandidates')) for item in records)
          biographies = sum(bool(item.get('biographyCandidates')) for item in records)
          committees = sum(bool(item.get('committeeCandidates')) for item in records)
          print(json.dumps({
              'records': len(records),
              'successes': successes,
              'portraitCandidates': portraits,
              'biographyCandidates': biographies,
              'committeeCandidates': committees,
          }, indent=2))
          assert len(records) == 6
          assert successes >= 5
          assert biographies >= 5
          PY

      - name: Upload live sample
        uses: actions/upload-artifact@v4
        with:
          name: florida-legislative-detail-smoke-${{ github.run_number }}
          path: data/research-staging/florida/legislative-details-smoke/*.json
          if-no-files-found: error
          retention-days: 7
