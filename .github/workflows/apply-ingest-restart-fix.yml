name: Apply ingest restart ownership fix

on:
  push:
    branches:
      - chatgpt/ingest-restart-owner-safe

permissions:
  contents: write

jobs:
  apply-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ingest-restart-owner-safe
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact tested patch
        run: git apply --check .github/compat-ingest-restart.patch && git apply .github/compat-ingest-restart.patch
      - name: Verify ingest suite
        run: node --experimental-strip-types --no-warnings --test services/hermes-ingest/tests/*.test.ts
      - name: Verify hash and clean staging artifacts
        run: |
          test "$(git hash-object services/hermes-ingest/src/spool.ts)" = "4c2847dbe03307457ac147d2e30acc588eccc580"
          git diff --check
          git rm .github/compat-ingest-restart.patch .github/workflows/apply-ingest-restart-fix.yml
          git add services/hermes-ingest/src/spool.ts
      - name: Commit clean verified change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Avoid chmod on already-secure receipt files [skip ci]"
          git push origin HEAD:chatgpt/ingest-restart-owner-safe
