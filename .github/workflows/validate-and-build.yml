name: Validate data and build site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workers/ingestion/requirements.txt

      - name: Install ingestion dependencies
        run: pip install -r workers/ingestion/requirements.txt

      - name: Test ingestion parsers
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate JSON records
        run: python scripts/validate_officials.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Public officials list must not include staging
        run: npm run test:public-officials

      - name: Collection runtime unit tests
        run: npm run test:collection-runtime

      - name: Build static website
        run: npm run build
