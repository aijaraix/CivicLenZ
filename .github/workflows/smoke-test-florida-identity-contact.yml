name: Smoke test Florida identity and contact enrichment

on:
  pull_request:
    paths:
      - 'workers/enrichment/collect_identity_contact_candidates.py'
      - 'workers/enrichment/build_profile_research_queue.py'
      - 'tests/test_identity_contact_candidates.py'
      - 'data/sources/enrichment-agent-manifest.json'
      - '.github/workflows/smoke-test-florida-identity-contact.yml'
      - '.github/workflows/collect-florida-senate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workers/ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r workers/ingestion/requirements.txt

      - name: Run parser regression tests
        run: python -m unittest tests.test_identity_contact_candidates tests.test_profile_research_queue

      - name: Rebuild Florida research queue
        run: python workers/enrichment/build_profile_research_queue.py

      - name: Collect a live official-source sample
        run: >-
          python -m workers.enrichment.collect_identity_contact_candidates
          --max-tasks 12
          --workers 4
          --minimum-success-rate 0.50
          --output data/research-staging/florida/identity-contact-smoke

      - name: Summarize sample
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('data/research-staging/florida/identity-contact-smoke').glob('*.json'))
          records = [json.loads(path.read_text()) for path in files]
          successes = sum(item.get('collectionStatus') == 'success' for item in records)
          portraits = sum(bool(item.get('portraitCandidates')) for item in records)
          contacts = sum(bool(item.get('contactCandidates')) for item in records)
          print(f'records={len(records)} successes={successes} portrait_candidates={portraits} contact_candidates={contacts}')
          assert len(records) == 12
          assert successes >= 6
          PY

      - name: Upload smoke-test candidates
        uses: actions/upload-artifact@v4
        with:
          name: florida-identity-contact-smoke-${{ github.run_number }}
          path: data/research-staging/florida/identity-contact-smoke/*.json
          if-no-files-found: error
          retention-days: 7
