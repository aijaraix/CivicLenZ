name: Smoke test federal baseline collectors

on:
  pull_request:
    paths:
      - 'workers/ingestion/common.py'
      - 'workers/ingestion/collect_us_house.py'
      - 'workers/ingestion/collect_us_senate.py'
      - 'workers/ingestion/collect_white_house_executive.py'
      - 'workers/ingestion/run_baseline_collectors.py'
      - 'data/sources/collector-manifest.json'
      - '.github/workflows/smoke-test-federal-baseline.yml'

permissions:
  contents: read

jobs:
  live-federal-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workers/ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r workers/ingestion/requirements.txt

      - name: Run parser regression tests
        run: python -m unittest discover -s tests -p 'test_collect_us_*.py'

      - name: Collect live official federal baseline
        run: python workers/ingestion/run_baseline_collectors.py --group federal

      - name: Validate live staging records
        run: python scripts/validate_officials.py

      - name: Verify federal record counts
        run: |
          house=$(find data/staging/federal/us-house -name '*.json' -type f | wc -l | tr -d ' ')
          senate=$(find data/staging/federal/us-senate -name '*.json' -type f | wc -l | tr -d ' ')
          executive=$(find data/staging/federal/executive -name '*.json' -type f | wc -l | tr -d ' ')
          echo "House: $house; Senate: $senate; Executive: $executive"
          test "$house" -ge 435
          test "$senate" -ge 95
          test "$executive" -eq 2
