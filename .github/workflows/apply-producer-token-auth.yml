name: Apply producer token auth fallback
on:
  push:
    branches: [chatgpt/producer-token-auth-fallback]
permissions:
  contents: write
jobs:
  apply-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psycopg2-binary
      - run: git apply token-auth-fallback.patch
      - run: python -m unittest discover -s services/hermes-prime/tests -p 'test_*.py'
      - name: Verify exact hashes
        run: |
          test "$(git hash-object services/hermes-prime/producer_outbound.py)" = 2af85f5d82a29ec4a6d27dcb698bd7dbc06867f1
          test "$(git hash-object services/hermes-prime/tests/test_producer_outbound.py)" = 4fb664b1835a6cfb85fde97ab5a2d8fc6edcafee
          git diff --check
      - run: rm token-auth-fallback.patch .github/workflows/apply-producer-token-auth.yml
      - name: Commit verified source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/hermes-prime/producer_outbound.py services/hermes-prime/tests/test_producer_outbound.py token-auth-fallback.patch .github/workflows/apply-producer-token-auth.yml
          git commit -m 'Allow explicit producer token authentication fallback [skip ci]'
          git push
