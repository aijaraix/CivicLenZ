name: Smoke test Florida Senate collector

on:
  pull_request:
    paths:
      - 'workers/ingestion/collect_florida_senate.py'
      - 'tests/test_collect_florida_senate.py'
      - '.github/workflows/smoke-test-florida-senate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-collection-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workers/ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r workers/ingestion/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Collect current Florida Senate directory into temporary staging
        run: python workers/ingestion/collect_florida_senate.py --output /tmp/civiclenz-florida-senate

      - name: Verify near-complete current directory
        run: |
          count=$(find /tmp/civiclenz-florida-senate -name '*.json' -type f | wc -l)
          echo "Collected $count staging records"
          test "$count" -ge 30
