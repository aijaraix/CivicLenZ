name: Apply producer bridge secret normalization
on:
  push:
    branches: [chatgpt/normalize-producer-bridge-secret]
permissions:
  contents: write
jobs:
  apply-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psycopg2-binary
      - run: git apply producer-secret-normalization.patch
      - run: python -m unittest discover -s services/hermes-prime/tests -p 'test_*.py'
      - name: Verify exact hashes
        run: |
          test "$(git hash-object services/hermes-prime/producer_outbound.py)" = d38694c4e5d3e83326c21c126a118ddcf5c6e434
          test "$(git hash-object services/hermes-prime/tests/test_producer_outbound.py)" = 1454bee11400740f72d1fb125b04ca91ed690a71
          git diff --check
      - run: rm producer-secret-normalization.patch .github/workflows/apply-producer-secret-normalization.yml
      - name: Commit verified source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/hermes-prime/producer_outbound.py services/hermes-prime/tests/test_producer_outbound.py producer-secret-normalization.patch .github/workflows/apply-producer-secret-normalization.yml
          git commit -m 'Normalize producer bridge secret like canonical receiver [skip ci]'
          git push
