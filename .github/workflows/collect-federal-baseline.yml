name: Collect federal baseline officials

# Aggregation-first worker: collect and preserve the federal roster without manual dispatch.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/ingestion/common.py'
      - 'workers/ingestion/collect_us_house.py'
      - 'workers/ingestion/collect_us_senate.py'
      - 'workers/ingestion/collect_white_house_executive.py'
      - 'workers/ingestion/run_baseline_collectors.py'
      - 'data/sources/collector-manifest.json'
      - '.github/workflows/collect-federal-baseline.yml'

concurrency:
  group: federal-baseline-aggregation
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workers/ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r workers/ingestion/requirements.txt

      - name: Run federal baseline collectors
        run: python workers/ingestion/run_baseline_collectors.py --group federal --workers 3

      - name: Validate collected records
        run: python scripts/validate_officials.py

      - name: Summarize collection
        id: summary
        run: |
          house=$(find data/staging/federal/us-house -name '*.json' -type f | wc -l | tr -d ' ')
          senate=$(find data/staging/federal/us-senate -name '*.json' -type f | wc -l | tr -d ' ')
          executive=$(find data/staging/federal/executive -name '*.json' -type f | wc -l | tr -d ' ')
          total=$((house + senate + executive))
          echo "house=$house" >> "$GITHUB_OUTPUT"
          echo "senate=$senate" >> "$GITHUB_OUTPUT"
          echo "executive=$executive" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          {
            echo "### Federal baseline aggregation"
            echo "- U.S. House seats/officeholders: **$house**"
            echo "- U.S. senators: **$senate**"
            echo "- President and Vice President: **$executive**"
            echo "- Total staging records: **$total**"
            echo "- Publication state: **review-only staging**"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$house" -ge 435
          test "$senate" -ge 95
          test "$executive" -eq 2

      - name: Upload federal staging snapshot
        uses: actions/upload-artifact@v4
        with:
          name: federal-baseline-staging-${{ github.run_number }}
          path: data/staging/federal/**/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Save or refresh federal review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAGING_PATH="data/staging/federal"
          BRANCH="bot/federal-baseline-refresh"
          CHANGES=$(git status --porcelain --untracked-files=all -- "$STAGING_PATH")

          if [ -z "$CHANGES" ]; then
            echo "No federal baseline changes detected."
            exit 0
          fi

          git config user.name "civiclenz-data-bot"
          git config user.email "civiclenz-data-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$STAGING_PATH"

          if git diff --cached --quiet; then
            echo "No staged federal differences remained."
            exit 0
          fi

          git commit -m "Refresh federal baseline staging records"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          git ls-remote --exit-code --heads origin "refs/heads/$BRANCH"
          echo "Saved ${{ steps.summary.outputs.total }} federal staging records to $BRANCH."

          OPEN_PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$OPEN_PR" ]; then
            if gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Data review: federal elected-official baseline" \
              --body "Automated aggregation of ${{ steps.summary.outputs.total }} review-only federal baseline records from the official House, Senate, and White House sources. These records must be normalized and promoted before public publication."; then
              echo "Created federal data-review pull request."
            else
              echo "Federal staging data was saved, but repository settings blocked workflow-created pull requests."
              echo "The fixed branch remains available at $BRANCH for one-time PR creation."
            fi
          else
            echo "Updated existing federal review PR #$OPEN_PR"
          fi
