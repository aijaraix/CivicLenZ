name: Validate CivicLenZ

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Florida work allocation
        shell: bash
        run: |
          if [[ -f data/operations/florida-work-allocation.json ]]; then
            python scripts/validate_florida_work_allocation.py
          else
            echo "Florida work allocation is supplied by the target branch; it is validated on pull-request merge refs and main."
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Public officials list must not include staging
        run: npm run test:public-officials

      - name: Build
        run: npm run build
