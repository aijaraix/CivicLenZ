name: Apply bounded producer recovery limit

on:
  push:
    branches:
      - chatgpt/producer-outbound-recovery-limit

permissions:
  contents: write

jobs:
  apply-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/producer-outbound-recovery-limit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Prime test dependency
        run: python -m pip install --quiet psycopg2-binary
      - name: Apply exact tested patch
        run: git apply --check .github/recovery-limit.patch && git apply .github/recovery-limit.patch
      - name: Verify HERMES Prime suite
        working-directory: services/hermes-prime
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: Verify exact source hashes
        run: |
          test "$(git hash-object services/hermes-prime/producer_outbound.py)" = "ec8340dae95827eb69e4c7d305a11ef1ee43e4c5"
          test "$(git hash-object services/hermes-prime/tests/test_producer_outbound.py)" = "2061a04e857a32f316bb53265a46680d0ba7e02f"
          git diff --check
      - name: Commit clean verified change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/hermes-prime/producer_outbound.py services/hermes-prime/tests/test_producer_outbound.py
          git rm .github/recovery-limit.patch .github/workflows/apply-recovery-limit.yml
          git commit -m "Bound same-attempt producer recovery to explicit limit [skip ci]"
          git push origin HEAD:chatgpt/producer-outbound-recovery-limit
