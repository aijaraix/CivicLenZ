name: Validate free collection fabric

on:
  pull_request:
    paths:
      - 'infra/free-fabric/**'
      - 'workers/orchestration/**'
      - 'scripts/inventory_legacy_official_datasets.py'
      - 'tests/test_inventory_legacy_official_datasets.py'
      - 'tests/test_orchestration_worker.py'
      - '.github/workflows/validate-free-collection-fabric.yml'
  push:
    branches: [main]
    paths:
      - 'infra/free-fabric/**'
      - 'workers/orchestration/**'
      - 'scripts/inventory_legacy_official_datasets.py'
      - 'tests/test_inventory_legacy_official_datasets.py'
      - 'tests/test_orchestration_worker.py'
      - '.github/workflows/validate-free-collection-fabric.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install worker dependencies
        run: pip install -r workers/ingestion/requirements.txt

      - name: Test dataset inventory and worker tooling
        run: >-
          python -m unittest
          tests.test_inventory_legacy_official_datasets
          tests.test_orchestration_worker

      - name: Validate D1 schema with SQLite
        run: |
          sqlite3 /tmp/civiclenz-control.db < infra/free-fabric/schema.sql
          sqlite3 /tmp/civiclenz-control.db ".tables"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/free-fabric/package.json

      - name: Install control-plane dependencies
        working-directory: infra/free-fabric
        run: npm install --no-audit --no-fund

      - name: Type-check Cloudflare control plane
        working-directory: infra/free-fabric
        run: npm run typecheck
