name: Collect Florida Senate directory

on:
  schedule:
    - cron: '27 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/ingestion/collect_florida_senate.py'
      - '.github/workflows/collect-florida-senate.yml'

concurrency:
  group: florida-senate-collection
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workers/ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r workers/ingestion/requirements.txt

      - name: Collect review-only staging records
        run: python workers/ingestion/collect_florida_senate.py

      - name: Validate all data
        run: python scripts/validate_officials.py

      - name: Create or refresh review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/staging/florida/state-senate; then
            echo "No directory changes detected."
            exit 0
          fi

          BRANCH="bot/florida-senate-refresh"
          git config user.name "civiclenz-data-bot"
          git config user.email "civiclenz-data-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/staging/florida/state-senate
          git commit -m "Refresh Florida Senate staging records"
          git push --force-with-lease origin "$BRANCH"

          OPEN_PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$OPEN_PR" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Data review: Florida Senate directory refresh" \
              --body "Automated extraction from the official Florida Senate directory. These files remain review-only staging records and must be matched to canonical people, offices, and terms before publication."
          else
            echo "Updated existing review PR #$OPEN_PR"
          fi
