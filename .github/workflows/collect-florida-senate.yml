name: Collect Florida baseline officials

on:
  schedule:
    - cron: '27 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/ingestion/common.py'
      - 'workers/ingestion/collect_florida_senate.py'
      - 'workers/ingestion/collect_florida_house.py'
      - 'workers/ingestion/collect_florida_statewide_executive.py'
      - 'workers/ingestion/run_baseline_collectors.py'
      - 'workers/enrichment/build_profile_research_queue.py'
      - 'workers/enrichment/collect_identity_contact_candidates.py'
      - 'data/sources/collector-manifest.json'
      - 'data/sources/source-registry.json'
      - 'data/sources/enrichment-agent-manifest.json'
      - 'data/sources/florida-county-source-registry.json'
      - '.github/workflows/collect-florida-senate.yml'

concurrency:
  group: florida-baseline-aggregation
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workers/ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r workers/ingestion/requirements.txt

      - name: Run enabled Florida baseline collectors
        run: python workers/ingestion/run_baseline_collectors.py --group florida

      - name: Build seat research queue
        run: python workers/enrichment/build_profile_research_queue.py

      - name: Collect portrait, contact, website, and social candidates
        run: >-
          python -m workers.enrichment.collect_identity_contact_candidates
          --workers 8
          --minimum-success-rate 0.45

      - name: Validate all data
        run: python scripts/validate_officials.py

      - name: Summarize Florida collection
        id: summary
        run: |
          senate=$(find data/staging/florida/state-senate -name '*.json' -type f | wc -l | tr -d ' ')
          house=$(find data/staging/florida/state-house -name '*.json' -type f | wc -l | tr -d ' ')
          statewide=$(find data/staging/florida/statewide-executive -name '*.json' -type f | wc -l | tr -d ' ')
          research_tasks=$(python -c "import json; print(json.load(open('data/operations/florida-profile-research-queue.json'))['taskCount'])")
          sections=$(python -c "import json; print(json.load(open('data/operations/florida-profile-research-queue.json'))['requiredSectionCountPerSeat'])")
          identity_records=$(find data/research-staging/florida/identity-contact -name '*.json' -type f | wc -l | tr -d ' ')
          identity_successes=$(python - <<'PY'
          import json
          from pathlib import Path
          records = [json.loads(path.read_text()) for path in Path('data/research-staging/florida/identity-contact').glob('*.json')]
          print(sum(item.get('collectionStatus') == 'success' for item in records))
          PY
          )
          portrait_candidates=$(python - <<'PY'
          import json
          from pathlib import Path
          records = [json.loads(path.read_text()) for path in Path('data/research-staging/florida/identity-contact').glob('*.json')]
          print(sum(bool(item.get('portraitCandidates')) for item in records))
          PY
          )
          contact_candidates=$(python - <<'PY'
          import json
          from pathlib import Path
          records = [json.loads(path.read_text()) for path in Path('data/research-staging/florida/identity-contact').glob('*.json')]
          print(sum(bool(item.get('contactCandidates')) for item in records))
          PY
          )
          total=$((senate + house + statewide))
          echo "senate=$senate" >> "$GITHUB_OUTPUT"
          echo "house=$house" >> "$GITHUB_OUTPUT"
          echo "statewide=$statewide" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "research_tasks=$research_tasks" >> "$GITHUB_OUTPUT"
          echo "identity_records=$identity_records" >> "$GITHUB_OUTPUT"
          echo "identity_successes=$identity_successes" >> "$GITHUB_OUTPUT"
          {
            echo "### Florida aggregation and initial enrichment"
            echo "- Florida senators: **$senate**"
            echo "- Florida House seats/officeholders: **$house**"
            echo "- Other statewide elected executive officers: **$statewide**"
            echo "- Total Florida state-government staging records: **$total**"
            echo "- Florida seat/profile research tasks: **$research_tasks**"
            echo "- Standard research sections per seat: **$sections**"
            echo "- Official-source pages successfully inspected: **$identity_successes / $identity_records**"
            echo "- Records with portrait candidates: **$portrait_candidates**"
            echo "- Records with contact candidates: **$contact_candidates**"
            echo "- County source-registry work queue: **67 counties**"
            echo "- Publication state: **identity/contact candidates require review before promotion**"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$senate" -ge 30
          test "$house" -ge 115
          test "$statewide" -eq 3
          test "$research_tasks" -ge 160
          test "$sections" -ge 20
          test "$identity_records" -ge 160

      - name: Upload Florida collection snapshot
        uses: actions/upload-artifact@v4
        with:
          name: florida-baseline-research-and-identity-${{ github.run_number }}
          path: |
            data/staging/florida/**/*.json
            data/operations/florida-profile-research-queue.json
            data/research-staging/florida/identity-contact/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Save or refresh Florida review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAGING_PATH="data/staging/florida"
          QUEUE_PATH="data/operations/florida-profile-research-queue.json"
          IDENTITY_PATH="data/research-staging/florida/identity-contact"
          BRANCH="bot/florida-baseline-refresh"
          CHANGES=$(git status --porcelain --untracked-files=all -- "$STAGING_PATH" "$QUEUE_PATH" "$IDENTITY_PATH")

          if [ -z "$CHANGES" ]; then
            echo "No Florida baseline, research-queue, or identity-candidate changes detected."
            exit 0
          fi

          git config user.name "civiclenz-data-bot"
          git config user.email "civiclenz-data-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$STAGING_PATH" "$QUEUE_PATH" "$IDENTITY_PATH"

          if git diff --cached --quiet; then
            echo "No staged Florida differences remained."
            exit 0
          fi

          git commit -m "Refresh Florida baseline, research queue, and identity candidates"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          git ls-remote --exit-code --heads origin "refs/heads/$BRANCH"
          echo "Saved ${{ steps.summary.outputs.total }} Florida staging records, ${{ steps.summary.outputs.research_tasks }} research tasks, and ${{ steps.summary.outputs.identity_records }} identity/contact records to $BRANCH."

          OPEN_PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$OPEN_PR" ]; then
            if gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Data review: Florida baseline, research queue, and identity candidates" \
              --body "Automated aggregation of ${{ steps.summary.outputs.total }} Florida state-government baseline records, ${{ steps.summary.outputs.research_tasks }} seat-centered enrichment tasks, and ${{ steps.summary.outputs.identity_records }} review-only portrait/contact candidate records. Images and contact candidates require provenance and identity review before public promotion."; then
              echo "Created Florida data-review pull request."
            else
              echo "Florida data was saved, but repository settings blocked workflow-created pull requests."
              echo "The branch remains available at $BRANCH; collection itself is complete."
            fi
          else
            echo "Updated existing Florida review PR #$OPEN_PR"
          fi
