name: Collect Florida Senate directory

on:
  schedule:
    - cron: '27 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/ingestion/collect_florida_senate.py'
      - '.github/workflows/collect-florida-senate.yml'

concurrency:
  group: florida-senate-collection
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workers/ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r workers/ingestion/requirements.txt

      - name: Collect review-only staging records
        id: collect
        run: |
          python workers/ingestion/collect_florida_senate.py
          count=$(find data/staging/florida/state-senate -name '*.json' -type f | wc -l | tr -d ' ')
          echo "Collected $count Florida Senate staging records."
          test "$count" -ge 30
          echo "record_count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "### Florida Senate collection"
            echo "- Review-only staging records collected: **$count**"
            echo "- Public profiles changed: **No**"
            echo "- Next step: create or update the data-review pull request"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate all data
        run: |
          python scripts/validate_officials.py
          echo "Validated ${{ steps.collect.outputs.record_count }} staging records and the canonical official dataset."

      - name: Upload staging snapshot
        uses: actions/upload-artifact@v4
        with:
          name: florida-senate-staging-${{ github.run_number }}
          path: data/staging/florida/state-senate/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Create or refresh review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STAGING_PATH="data/staging/florida/state-senate"
          CHANGES=$(git status --porcelain --untracked-files=all -- "$STAGING_PATH")

          if [ -z "$CHANGES" ]; then
            echo "No directory changes detected. The live source matches the current staging branch."
            exit 0
          fi

          echo "Detected staging changes:"
          echo "$CHANGES"

          BRANCH="bot/florida-senate-refresh"
          git config user.name "civiclenz-data-bot"
          git config user.email "civiclenz-data-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$STAGING_PATH"

          if git diff --cached --quiet; then
            echo "No staged differences remained after adding the staging directory."
            exit 0
          fi

          git commit -m "Refresh Florida Senate staging records"
          git push --force-with-lease origin "$BRANCH"

          OPEN_PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$OPEN_PR" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Data review: Florida Senate directory refresh" \
              --body "Automated extraction of ${{ steps.collect.outputs.record_count }} records from the official Florida Senate directory. These files remain review-only staging records and must be matched to canonical people, offices, and terms before publication."
          else
            echo "Updated existing review PR #$OPEN_PR"
          fi
